<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign in</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #e5e7eb;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: #1a1d24; padding: 32px; border-radius: 12px; width: 320px; }
  input { width: 100%; padding: 10px; margin-top: 12px; border-radius: 6px; border: 1px solid #333;
          background: #0f1115; color: #fff; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin-top: 16px; border-radius: 6px; border: none;
           background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
  #msg { margin-top: 12px; font-size: 14px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="card">
    <h2>Trading Dashboard</h2>
    <p>Enter your email for a sign-in link.</p>
    <input id="email" type="email" placeholder="you@example.com" />
    <button onclick="sendLink()">Send link</button>
    <div id="msg"></div>
  </div>
  <script>
    async function sendLink() {
      const email = document.getElementById('email').value;
      document.getElementById('msg').innerText = 'Sending...';
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      document.getElementById('msg').innerText = res.ok
        ? 'Check your email for a sign-in link.'
        : (data.detail || 'Something went wrong.');
    }
  </script>
</body>
</html>
